<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Police Fugitive Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div id="login-screen" class="screen">
        <h2>System Login</h2>
        <div>
            <label>Officer ID:</label>
            <input type="text" id="login-id" placeholder="Enter ID">
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="login-pass" placeholder="Enter Password">
        </div>
        <button id="login-btn">Login</button>
        <p>Don't have an account? <a href="#register" id="go-to-register">Register here</a></p>
    </div>

    <div id="register-screen" class="screen" style="display: none;">
        <h2>New Officer Registration</h2>
        <div>
            <label>Officer ID:</label>
            <input type="text" id="reg-id" placeholder="Choose ID">
        </div>
        <div>
            <label>Full Name:</label>
            <input type="text" id="reg-name" placeholder="John Doe">
        </div>
        <div>
            <label>Password:</label>
            <input type="password" id="reg-pass" placeholder="Create Password">
        </div>
        <button id="register-btn">Register</button>
        <p>Already registered? <a href="#login" id="go-to-login">Login here</a></p>
    </div>

    <div id="dashboard-screen" class="screen" style="display: none;">

        <header class="dashboard-header">
            <h2>Fugitive Management System</h2>
            <div class="user-controls">
                <span id="welcome-msg">Welcome, Officer</span>
                <button id="logout-btn" class="danger-btn">Logout</button>
            </div>
        </header>
        <div class="dashboard-content">

            <section class="control-panel">
                <h3>Add New Fugitive</h3>
                <div class="form-grid">
                    <div>
                        <label>Fugitive ID:</label>
                        <input type="text" id="fugitive-id" placeholder="ID Number">
                    </div>
                    <div>
                        <label>Full Name:</label>
                        <input type="text" id="fugitive-name" placeholder="Name">
                    </div>
                    <div>
                        <label>Risk Level:</label>
                        <select id="fugitive-risk">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                            <option value="Extreme">Extreme</option>
                        </select>
                    </div>
                    <div>
                        <label>Status:</label>
                        <select id="fugitive-status">
                            <option value="At Large">At Large</option>
                            <option value="In Custody">In Custody</option>
                            <option value="Deceased">Deceased</option>
                        </select>
                    </div>
                    <div class="full-width">
                        <label>Description:</label>
                        <input type="text" id="fugitive-desc"
                            placeholder="Physical description, last known location...">
                    </div>
                </div>
                <button id="add-fugitive-btn" class="primary-btn">Add Fugitive</button>
            </section>

            <hr>

            <section class="data-panel">

                <div class="filters">
                    <label>Search:</label>
                    <input type="text" id="search-input" placeholder="Search by name...">

                    <label>Status:</label>
                    <select id="filter-status-select">
                        <option value="All">All</option>
                        <option value="At Large">At Large</option>
                        <option value="In Custody">In Custody</option>
                        <option value="Deceased">Deceased</option>
                    </select>

                    <label>Risk Level:</label>
                    <select id="filter-risk-select">
                        <option value="All">All</option>
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                        <option value="Extreme">Extreme</option>
                    </select>

                    <label style="display: flex; align-items: center; gap: 5px; cursor: pointer; margin-left: 10px;">
                        <input type="checkbox" id="filter-my-fugitives"
                            style="width: auto; min-width: auto; cursor: pointer;">
                        My Fugitives Only
                    </label>
                </div>

                <div class="table-container">
                    <table id="fugitives-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Risk Level</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="fugitives-table-body">
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </div>
    <script src="js/User.js"></script>
    <script src="js/fugitive.js"></script>
    <script src="js/user_DB-Api.js"></script>
    <script src="js/Fugitive_DB-Api.js"></script>
    <script src="js/usersServer.js"></script>
    <script src="js/fugitiveServer.js"></script>
    <script src="js/fajaxHttpRequest.js"></script>
    <script src="js/network.js"></script>
    <script src="js/app-router.js"></script>
    <script src="js/user-ui.js"></script>
    <script src="js/fugitive-ui.js"></script>
</body>

</html>
